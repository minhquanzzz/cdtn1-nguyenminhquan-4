services:
  postgres:
    image: postgres:16
    container_name: cdtn1-l4-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cdtn1_l4
      POSTGRES_USER: cdtn1_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: